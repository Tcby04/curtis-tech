<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Roulette — Trent Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --accent: #7c3aed;
      --accent2: #ec4899;
      --text: #f1f5f9;
      --muted: #64748b;
      --spin: 0deg;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.15;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .bg-glow.purple { background: var(--accent); }
    .bg-glow.pink { background: var(--accent2); transform: translate(-30%, -30%) scale(0.8); }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 3rem;
      text-align: center;
    }

    .wheel-container {
      position: relative;
      width: min(85vw, 420px);
      aspect-ratio: 1;
      margin-bottom: 2.5rem;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from var(--spin),
        #7c3aed 0deg 51deg,
        #ec4899 51deg 102deg,
        #06b6d4 102deg 153deg,
        #10b981 153deg 204deg,
        #f59e0b 204deg 255deg,
        #ef4444 255deg 306deg,
        #8b5cf6 306deg 360deg
      );
      box-shadow: 
        0 0 0 8px rgba(255,255,255,0.05),
        0 0 60px rgba(124, 58, 237, 0.3),
        inset 0 0 60px rgba(0,0,0,0.3);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .wheel.spinning {
      transform: rotate(calc(var(--spin) + 1800deg)) !important;
    }

    .wheel-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      height: 55%;
      border-radius: 50%;
      background: var(--card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    }

    .wheel-label .label-title {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.25rem;
    }

    .wheel-label .label-text {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      line-height: 1.3;
      color: var(--text);
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      z-index: 10;
    }

    .spin-btn {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 1rem 3rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(124, 58, 237, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .spin-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 40px rgba(124, 58, 237, 0.6);
    }

    .spin-btn:active { transform: scale(0.97); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .result-card {
      margin-top: 2rem;
      background: var(--card);
      border-radius: 20px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: opacity 0.5s, transform 0.5s;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .result-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .result-card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-card .idea {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .result-card .tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .result-card .tag {
      background: rgba(124, 58, 237, 0.2);
      color: #a78bfa;
      padding: 0.3rem 0.8rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .creds {
      position: fixed;
      bottom: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .creds a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="bg-glow purple"></div>
  <div class="bg-glow pink"></div>

  <h1>Idea Roulette</h1>
  <p class="subtitle">Trent's billion-dollar idea generator 🎰</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <div class="wheel-label">
        <span class="label-title">Spin to find your</span>
        <span class="label-text" id="wheelText">—</span>
      </div>
    </div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">
    🎲 Spin the Wheel
  </button>

  <div class="result-card" id="resultCard">
    <h2 id="ideaTitle">Your Next Move:</h2>
    <p class="idea" id="ideaText"></p>
    <div class="tags" id="ideaTags"></div>
  </div>

  <p class="creds">Built for Trent — ideas built around food trucks, travel, AI & no debt</p>

  <script>
    const segments = [
      {
        label: "Food Truck",
        title: "Food Truck Analytics",
        text: "A platform that tracks foot traffic patterns, competitor locations, and event calendars to tell food trucks exactly where to set up each day. Real-time location scoring.",
        tags: ["NWA", "Data", "SaaS"]
      },
      {
        label: "AI Tool",
        title: "Micro-SaaS Builder Kit",
        text: "A boilerplate that lets Trent ship micro-SaaS products in hours, not weeks. Stripe, GitHub Pages, and a template that handles the boring stuff.",
        tags: ["AI", "No-Code", "Stripe"]
      },
      {
        label: "Travel",
        title: "Visa Route Planner",
        text: "An interactive tool for expats that maps out visa pathways, COFA nations, and entry exceptions. Shows which countries let you stay longest without hassle.",
        tags: ["Travel", "Philippines", "Maps"]
      },
      {
        label: "Crypto",
        title: "No-GPU Trading Bot",
        text: "A cloud-based crypto strategy tester and live trader that runs entirely through API calls. Train models on historical data, deploy with one click.",
        tags: ["Crypto", "API", "Trading"]
      },
      {
        label: "Art",
        title: "Hidden Art Map",
        text: "A community-curated map of outdoor murals, sculptures, and installations. QR codes at each location unlock artist stories and AR easter eggs.",
        tags: ["TeamLab", "Community", "Maps"]
      },
      {
        label: "Pizza",
        title: "NWA Pizza Co.",
        text: "A thick-crust pizza food truck targeting the 479 area code. $8-12 pies, event catering, farmers market presence. Supply chain via Sysco.",
        tags: ["Pizza", "Food Truck", "NWA"]
      },
      {
        label: "OSINT",
        title: "Breach Watch Pro",
        text: "Monitor your clients' emails for breaches and alert them automatically. White-label dashboard for MSPs. Tiered pricing: $5-50/mo per client.",
        tags: ["Security", "OSINT", "B2B"]
      }
    ];

    const wheel = document.getElementById('wheel');
    const wheelText = document.getElementById('wheelText');
    const spinBtn = document.getElementById('spinBtn');
    const resultCard = document.getElementById('resultCard');
    const ideaTitle = document.getElementById('ideaTitle');
    const ideaText = document.getElementById('ideaText');
    const ideaTags = document.getElementById('ideaTags');

    let spinning = false;

    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      resultCard.classList.remove('show');

      const segmentAngle = 360 / segments.length;
      const randomIndex = Math.floor(Math.random() * segments.length);
      const targetAngle = 360 - (randomIndex * segmentAngle) - (segmentAngle / 2);
      
      // Random extra spins
      const extraSpins = 5 + Math.floor(Math.random() * 3);
      const totalRotation = extraSpins * 360 + targetAngle;

      wheel.style.setProperty('--spin', totalRotation + 'deg');
      wheel.classList.add('spinning');

      setTimeout(() => {
        wheel.classList.remove('spinning');
        wheel.style.setProperty('--spin', '0deg');
        
        const seg = segments[randomIndex];
        wheelText.textContent = seg.label;
        
        ideaTitle.textContent = seg.title;
        ideaText.textContent = seg.text;
        ideaTags.innerHTML = seg.tags.map(t => `<span class="tag">${t}</span>`).join('');
        
        setTimeout(() => {
          resultCard.classList.add('show');
          spinning = false;
          spinBtn.disabled = false;
        }, 300);
      }, 4200);
    }
  </script>
</body>
</html>
